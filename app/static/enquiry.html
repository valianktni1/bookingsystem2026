<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#f8f5ef">
  <title>Wedding enquiry - Weddings By Mark</title>
  <link rel="stylesheet" href="/static/enquiry.css?v=editable-form-v8-9-7">
</head>
<body>
  <main>
    <section id="enquiry-card" class="card">
      <header>
        <img class="enquiry-logo" src="/static/branding/weddings-by-mark-logo.png" alt="Weddings By Mark">
        <small>WEDDINGS BY MARK</small>
        <h1 id="enquiry-heading">Wedding enquiry</h1>
        <p id="enquiry-introduction">Loading your enquiry form…</p>
      </header>
      <aside id="payment-note" class="payment-note hidden"></aside>
      <form id="enquiry-form">
        <div id="enquiry-fields" class="form-grid"><p class="loading-form">Loading questions…</p></div>
        <label class="honeypot" aria-hidden="true">Website<input name="website" tabindex="-1" autocomplete="off"></label>
        <p id="form-error" class="error" role="alert"></p>
        <button id="submit-button" type="submit" disabled>Submit enquiry</button>
      </form>
    </section>
    <section id="success" class="card success hidden">
      <span>✓</span>
      <h1 id="success-heading">Thank you!</h1>
      <p id="success-message">Your enquiry has landed safely.</p>
      <strong>Mark - Weddings By Mark</strong>
    </section>
  </main>
  <script src="/static/venue-autocomplete.js?v=client-experience-v8-1" defer></script>
  <script src="/static/enquiry.js?v=editable-form-v8-9-7" defer></script>
</body>
</html>
