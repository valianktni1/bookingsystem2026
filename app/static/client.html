<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#102b34">
  <title>Your wedding booking</title>
  <link rel="stylesheet" href="/static/client.css?v=phone-call-email-controls-v8-9-4">
  <link rel="stylesheet" href="/static/quote.css?v=phone-call-email-controls-v8-9-4">
  <link rel="stylesheet" href="/static/client-v898.css?v=travel-only-required-addon-v8-9-8-1">
</head>
<body>
  <header class="portal-header"><div class="header-inner"><span class="brand-mark"><img id="business-logo" src="/static/branding/weddings-by-mark-logo.png" alt=""></span><div><strong id="business-name">Weddings By Mark</strong><small>Secure client area</small></div><span class="secure-chip">● Secure</span></div></header>
  <main id="portal" class="hidden">
    <section class="hero"><div><small id="booking-label">YOUR WEDDING BOOKING</small><h1 id="record-title"></h1><p id="record-summary"></p></div><strong id="countdown" class="countdown"></strong></section>
    <nav id="tabs" class="portal-tabs" aria-label="Your booking sections"></nav>
    <section id="panel" class="panel"></section>
    <footer class="portal-footer"><span>Need a hand?</span><a id="business-email" href="#">Contact Mark</a></footer>
  </main>
  <main id="loading" class="state"><div class="spinner"></div><p>Loading your booking…</p></main>
  <main id="error" class="state hidden"><h1>We couldn't open this link</h1><p id="error-message"></p></main>
  <div id="toast" class="toast hidden"></div>
  <script src="/static/client.js?v=travel-only-required-addon-v8-9-8-1" defer></script>
  <script src="/static/client-v898.js?v=travel-only-required-addon-v8-9-8-1" defer></script>
</body>
</html>
